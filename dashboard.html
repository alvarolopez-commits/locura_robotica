<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221e41">
<meta name="color-scheme" content="only light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Locura">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Mobile Suit Archive</title>
<meta name="description" content="Catálogo personal de Gundam Card Game (ST01–ST14, GD01–GD05 y EB01) con ficha completa, categorías de habilidad y constructor de mazos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&family=Big+Shoulders+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== TOKENS · HUD técnico, mobile-first ===== */
:root{
  --navy:#221e41; --navy-2:#2c2757; --paper:#eef2f5; --panel:#ffffff; --tone:#e3eaef; --tone-2:#d3dde5; --line:#c6d3dc;
  --fg-1:#221e41; --fg-2:#2e4a62; --fg-3:#4b6880;
  --on-navy:#e6eef6; --on-navy-2:#a9bdd2;
  --accent:#3e707c; --accent-ink:#2f5a66; --sky:#8bcdff; --sky-ink:#0e2338; --rose:#f4a6a6; --rose-ink:#5c1f1f;
  --c-blue:#3b6ea5; --c-green:#4a7a52; --c-red:#b5544a; --c-purple:#7a5b9c; --c-white:#aeb4c2;
  --font-sans:'Zen Kaku Gothic New','Noto Sans JP',system-ui,-apple-system,sans-serif;
  --font-display:'Big Shoulders Display',var(--font-sans);
  --ease:cubic-bezier(0.32,0.72,0,1); --ease-out:cubic-bezier(0.16,1,0.3,1);
  --cut:10px; --cut-l:18px;
  --top-h:calc(54px + env(safe-area-inset-top,0px));
  --tab-h:62px; --tab-total:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));
  --pad:14px;
  color-scheme:only light;
}

/* esquina superior-izquierda e inferior-derecha cortadas, como la web oficial */
.cut{ clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut)); }

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; scroll-padding-top:calc(var(--top-h) + 76px); }
body{
  margin:0; min-height:100dvh; font-family:var(--font-sans); font-size:15px; line-height:1.5; color:var(--fg-2);
  background:
    radial-gradient(70vw 40vh at 100% 0%, rgba(62,112,124,.16), transparent 70%),
    radial-gradient(60vw 40vh at 0% 100%, rgba(139,205,255,.22), transparent 70%),
    var(--paper);
  background-attachment:fixed;
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image:linear-gradient(rgba(62,112,124,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(62,112,124,.07) 1px, transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:linear-gradient(#000, transparent 70%); mask-image:linear-gradient(#000, transparent 70%);
}
img{ max-width:100%; }
[hidden]{ display:none !important; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; text-align:inherit; }
input{ font:inherit; color:inherit; }
h1,h2,h3{ margin:0; }
::selection{ background:color-mix(in srgb, var(--sky) 60%, transparent); color:var(--fg-1); }
input,textarea{ caret-color:var(--accent); }
:focus-visible{ outline:3px solid var(--accent); outline-offset:-3px; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--line); border-radius:4px; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; scroll-behavior:auto !important; }
}

/* ===== TIPOS ===== */
.eyebrow{ font-family:var(--font-display); font-size:14px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-3); }
.num{ font-variant-numeric:tabular-nums; }

/* ===== ETIQUETAS · chaflán en ambos extremos ===== */
.tag{
  display:inline-flex; align-items:center; font-family:var(--font-display); font-size:13px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; line-height:1;
  padding:8px 12px; min-height:28px; white-space:nowrap; cursor:default;
  background:color-mix(in srgb, var(--accent) 13%, white); color:var(--accent-ink);
  clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);
  transition:background .18s var(--ease);
}
.tag.hi{ background:var(--accent); color:#fff; }
.tag.chip{ cursor:pointer; background:var(--tone); color:var(--fg-2); min-height:40px; padding:8px 16px; clip-path:none; border-radius:9999px; }
.tag.chip.active{ background:var(--sky); color:var(--sky-ink); }
.tag.chip[data-color="Blue"].active{ background:var(--c-blue); color:#fff; }
.tag.chip[data-color="Green"].active{ background:var(--c-green); color:#fff; }
.tag.chip[data-color="Red"].active{ background:var(--c-red); color:#fff; }
.tag.chip[data-color="Purple"].active{ background:var(--c-purple); color:#fff; }
.tag.chip[data-color="White"].active{ background:var(--c-white); color:var(--navy); }
.tag.removable{ gap:2px; padding:2px 4px 2px 14px; min-height:34px; clip-path:none; border-radius:9999px; background:color-mix(in srgb, var(--accent) 16%, white); }
.tag.removable button{ width:30px; height:30px; display:grid; place-items:center; border-radius:50%; opacity:.75; }
.tag.removable button:hover{ opacity:1; background:color-mix(in srgb, var(--accent) 20%, transparent); }

/* estado de la carta: TENGO / FALTA */
.delta{
  display:inline-flex; align-items:center; gap:4px; font-family:var(--font-display); font-size:13px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; line-height:1;
  padding:6px 10px 6px 12px; clip-path:polygon(6px 0,100% 0,100% 100%,0 100%,0 6px);
}
.delta-up{ background:var(--sky); color:var(--sky-ink); }
.delta-dn{ background:var(--rose); color:var(--rose-ink); }

/* ===== CABECERA ===== */
.db-wrap{ min-height:100dvh; display:flex; flex-direction:column; }
.db-top{
  position:sticky; top:0; z-index:36; display:flex; align-items:center; gap:10px;
  height:var(--top-h); padding:env(safe-area-inset-top,0px) var(--pad) 0;
  background:var(--navy); box-shadow:inset 0 -2px 0 rgba(139,205,255,.28);
}
.db-top-logo{ position:relative; margin:0 auto 0 -8px; display:flex; padding:6px 8px; border-radius:2px; -webkit-tap-highlight-color:transparent; }
.db-top-logo img{ height:30px; width:auto; display:block; transition:transform .35s var(--ease-out), filter .35s var(--ease-out); }
.db-top-logo::before,.db-top-logo::after{
  content:""; position:absolute; width:10px; height:10px; opacity:0; pointer-events:none;
  transition:opacity .2s var(--ease), transform .35s var(--ease-out);
}
.db-top-logo::before{ top:0; left:0; border-top:2px solid var(--sky); border-left:2px solid var(--sky); transform:translate(-6px,-6px); }
.db-top-logo::after{ right:0; bottom:0; border-bottom:2px solid var(--sky); border-right:2px solid var(--sky); transform:translate(6px,6px); }
.db-top-logo:active::before,.db-top-logo:active::after,.db-top-logo:focus-visible::before,.db-top-logo:focus-visible::after{ opacity:1; transform:none; }
.db-top-logo:active img{ transform:scale(.97); }
.db-top-logo:focus-visible{ outline:none; }
@media (hover:hover){
  .db-top-logo:hover::before,.db-top-logo:hover::after{ opacity:1; transform:none; }
  .db-top-logo:hover img{ transform:translateX(2px); filter:brightness(0) saturate(100%) invert(79%) sepia(22%) saturate(1066%) hue-rotate(181deg) brightness(102%); }
}
.lang-toggle{ display:flex; padding:3px; gap:2px; background:rgba(255,255,255,.09); border-radius:9999px; }
.lang-toggle .lt-opt{ display:grid; place-items:center; min-width:42px; min-height:38px; border-radius:9999px; font-family:var(--font-display); font-size:14px; font-weight:700; letter-spacing:.08em; color:var(--on-navy-2); transition:background .16s var(--ease), color .16s var(--ease); }
.lang-toggle .lt-opt.active{ background:var(--sky); color:var(--sky-ink); }
.pillWrap{ position:relative; flex:none; }
.deck-pill{
  display:flex; align-items:center; gap:8px; min-height:42px; padding:0 16px; background:var(--sky); color:var(--sky-ink);
  font-family:var(--font-display); font-size:17px; font-weight:700; letter-spacing:.04em;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px); transition:transform .16s var(--ease);
}
.deck-pill:active{ transform:scale(.97); }
.pillMenu{
  position:absolute; top:calc(100% + 8px); right:0; z-index:50; min-width:220px; padding:6px;
  background:var(--navy); color:var(--on-navy); opacity:0; transform:translateY(-6px); pointer-events:none;
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  transition:opacity .16s var(--ease), transform .16s var(--ease);
}
.pillMenu.open{ opacity:1; transform:none; pointer-events:auto; }
.pm-item{ display:flex; align-items:center; gap:12px; width:100%; min-height:48px; padding:0 14px; font-size:15px; font-weight:700; color:var(--on-navy); transition:background .14s var(--ease); }
.pm-item:hover{ background:rgba(255,255,255,.08); }
.pm-item svg{ flex:none; color:var(--sky); }

/* ===== CUERPO ===== */
.db-body{ display:block; flex:1; }
.db-main{ padding:18px var(--pad) calc(var(--tab-total) + 28px); display:flex; flex-direction:column; gap:14px; min-width:0; }

.pageTitle h1{
  font-family:var(--font-display); font-size:clamp(34px,10.5vw,52px); font-weight:700; line-height:.94; letter-spacing:.005em;
  text-transform:uppercase; color:var(--fg-1); text-wrap:balance;
}
.pa-row{ display:flex; align-items:center; gap:10px; margin-top:16px; }
.pageActions{ flex:1; min-width:0; display:flex; gap:3px; }
.pa-btn{
  flex:1; display:flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:0 10px;
  background:var(--navy); color:var(--on-navy); font-size:14px; font-weight:700; white-space:nowrap;
  transition:background .2s var(--ease), color .2s var(--ease), opacity .25s var(--ease);
}
.pa-btn:first-child{ clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut)); }
.pa-btn:last-child{ clip-path:polygon(0 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%); }
.pa-btn:hover{ background:var(--navy-2); }
.pa-btn.is-selected{ background:var(--sky); color:var(--sky-ink); }
.pageActions:has(.is-selected) .pa-btn:not(.is-selected){ opacity:.55; }
.pa-ico{ width:22px; height:22px; flex:none; display:grid; place-items:center; background:rgba(139,205,255,.2); color:var(--sky); transition:background .2s var(--ease), color .2s var(--ease); }
.pa-btn.is-selected .pa-ico{ background:rgba(14,35,56,.14); color:var(--sky-ink); }
.pa-sep{ display:none; }
.avatar{ flex:none; width:52px; height:52px; padding:3px; position:relative; background:linear-gradient(135deg, var(--sky), var(--accent)); clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut)); }
.avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
.avatar::after{ content:""; position:absolute; right:4px; bottom:4px; width:10px; height:10px; border-radius:50%; background:#6fdc8c; box-shadow:0 0 0 2px var(--paper); }

.addDeckPanel{ display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .32s var(--ease-out), opacity .22s var(--ease); }
.addDeckPanel.open{ grid-template-rows:1fr; opacity:1; }
.adp-inner{ min-height:0; overflow:hidden; }
.adp-card{ margin-top:12px; display:flex; flex-direction:column; gap:10px; padding:16px; background:var(--panel); clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut)); }
.adp-label{ font-family:var(--font-display); font-size:14px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); }
.adp-row{ display:flex; gap:8px; flex-wrap:wrap; }
.adp-input{ flex:1; min-width:180px; min-height:50px; border:0; outline:none; background:var(--tone); font-size:16px; color:var(--fg-1); padding:0 16px; box-shadow:inset 0 -2px 0 var(--line); transition:box-shadow .15s var(--ease); }
.adp-input::placeholder{ color:var(--fg-3); }
.adp-input:focus{ box-shadow:inset 0 -3px 0 var(--accent); }
.adp-submit{ min-height:50px; padding:0 24px; background:var(--accent); color:#fff; font-size:15px; font-weight:700; text-align:center; clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%); }
@media (max-width:559px){ .adp-submit{ flex:1; } }

.buildBar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 16px; padding:12px 14px; background:var(--navy); color:var(--on-navy); clip-path:polygon(var(--cut) 0,100% 0,100% 100%,0 100%,0 var(--cut)); animation:bbIn .45s var(--ease-out); }
@keyframes bbIn{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:none; } }
.bb-main{ min-width:0; flex:1 1 180px; }
.bb-eyebrow{ display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-size:14px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--sky); }
.bb-dot{ width:8px; height:8px; background:var(--sky); }
.bb-name{ font-family:var(--font-display); font-size:clamp(24px,7vw,32px); font-weight:700; line-height:1.05; letter-spacing:.01em; text-transform:uppercase; color:#fff; margin-top:2px; overflow-wrap:anywhere; }
.bb-side{ display:flex; align-items:center; gap:14px; }
.bb-count{ font-size:13px; font-weight:600; color:var(--on-navy-2); font-variant-numeric:tabular-nums; }
.bb-count b{ font-family:var(--font-display); font-size:34px; font-weight:700; color:#fff; line-height:1; margin-right:2px; }
.bb-link{ min-height:44px; display:inline-flex; align-items:center; font-size:14px; font-weight:700; color:var(--sky); text-decoration:underline; text-underline-offset:4px; }

/* ===== BUSCADOR PEGAJOSO · zona del pulgar ===== */
.findbar{ position:sticky; top:var(--top-h); z-index:30; margin:0 calc(var(--pad) * -1); padding:10px var(--pad) 8px; background:linear-gradient(var(--paper) 78%, transparent); }
.searchbar{ display:flex; align-items:center; gap:10px; min-height:52px; padding:4px 4px 4px 16px; background:var(--panel); clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut)); box-shadow:inset 0 -3px 0 transparent; transition:box-shadow .2s var(--ease); }
.searchbar:focus-within{ box-shadow:inset 0 -3px 0 var(--accent); }
.sb-eyebrow,.sb-div{ display:none; }
.sb-input{ flex:1; min-width:0; min-height:48px; border:0; outline:none; background:transparent; font-size:16px; color:var(--fg-1); -webkit-appearance:none; appearance:none; }
.sb-input::placeholder{ color:var(--fg-3); }
.sb-input::-webkit-search-cancel-button{ -webkit-appearance:none; }
.sb-btn{ flex:none; width:44px; height:44px; display:grid; place-items:center; background:var(--sky); color:var(--sky-ink); border-radius:50%; transition:transform .16s var(--ease); }
.sb-btn:active{ transform:scale(.95); }
.addfilter-btn{ display:none; }
.quick{ display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:8px 0 0; margin-right:calc(var(--pad) * -1); padding-right:var(--pad); }
.quick::-webkit-scrollbar{ display:none; }
.quick .tag{ flex:none; }

.resultbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.resultbar .count{ font-size:13px; color:var(--fg-3); font-weight:700; }
.resultbar .clearbtn{ margin-left:auto; min-height:40px; display:inline-flex; align-items:center; font-size:14px; font-weight:700; color:var(--accent-ink); text-decoration:underline; text-underline-offset:3px; }
#activeFilters{ display:flex; gap:6px; flex-wrap:wrap; width:100%; order:3; }
#activeFilters:empty{ display:none; }

/* ===== REJILLA DE CARTAS ===== */
.grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
.grid:empty{ display:none; }
.dz{ min-width:0; content-visibility:auto; contain-intrinsic-size:auto 300px; }
.dz-inner{
  --cut:12px; position:relative; height:100%; display:flex; flex-direction:column; overflow:hidden; cursor:pointer; background:var(--panel);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  transition:transform .3s var(--ease-out), background .2s var(--ease);
}
.dz-inner.enter{ animation:tileIn .5s var(--ease-out) backwards; }
@keyframes tileIn{ from{ opacity:0; transform:translateY(10px); } }
.dz-inner:active{ transform:scale(.985); }
.dz-inner .status{ position:absolute; top:12px; right:0; z-index:2; }
.dz-inner .colorbit{ position:absolute; top:24px; left:0; width:4px; height:34px; z-index:2; }
.dz-inner .colorbit[data-color="Blue"]{ background:var(--c-blue); } .dz-inner .colorbit[data-color="Green"]{ background:var(--c-green); }
.dz-inner .colorbit[data-color="Red"]{ background:var(--c-red); } .dz-inner .colorbit[data-color="Purple"]{ background:var(--c-purple); }
.dz-inner .colorbit[data-color="White"]{ background:var(--c-white); }
.card-imgwrap{ aspect-ratio:63/88; background:var(--tone); margin:8px 8px 0; overflow:hidden; }
.card-imgwrap img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s var(--ease-out); }
.card-body{ padding:6px 8px 10px; display:flex; flex-direction:column; gap:6px; }
.card-tagrow{ display:flex; flex-wrap:wrap; gap:4px; }
.card-tagrow:empty{ display:none; }
.card-tagrow .tag{ font-size:12.5px; padding:5px 9px; min-height:26px; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.card-body:has(.card-tagrow:empty){ padding-bottom:8px; }
.empty{ grid-column:1 / -1; text-align:center; padding:56px 20px; color:var(--fg-3); font-size:14px; background:var(--panel); clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut)); }

/* selector +/− grande: pulgar cómodo */
.deck-stepper{ display:grid; grid-template-columns:44px 1fr 44px; align-items:center; gap:0; }
.ds-btn{ width:44px; height:44px; border-radius:50%; display:grid; place-items:center; background:var(--tone); color:var(--fg-1); transition:background .15s var(--ease), color .15s var(--ease), transform .12s var(--ease); }
.ds-btn svg{ width:16px; height:16px; display:block; }
.ds-btn:active{ background:var(--accent); color:#fff; transform:scale(.96); }
.ds-btn:disabled{ opacity:.35; cursor:not-allowed; }
.ds-count{ font-family:var(--font-display); font-size:26px; font-weight:700; line-height:1; text-align:center; color:var(--fg-3); }
.deck-stepper.has-qty .ds-count{ color:var(--accent-ink); }

/* ===== FILTROS · hoja inferior en móvil ===== */
.sb-scrim{ display:none; }
.sb-scrim.show{ display:block; position:fixed; inset:0; z-index:55; background:rgba(10,9,20,.5); }
.db-sidebar{
  position:fixed; z-index:60; left:0; right:0; bottom:0; max-height:88dvh; overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; gap:8px; padding:0 var(--pad); background:var(--paper);
  clip-path:polygon(var(--cut-l) 0,100% 0,100% 100%,0 100%,0 var(--cut-l));
  transform:translateY(105%); visibility:hidden; transition:transform .38s var(--ease-out), visibility 0s linear .38s;
}
.db-sidebar.open{ transform:none; visibility:visible; transition:transform .38s var(--ease-out), visibility 0s; }
.sb-sheethead{ position:sticky; top:0; z-index:2; margin:0 calc(var(--pad) * -1); padding:10px var(--pad) 8px; background:linear-gradient(var(--paper) 80%, transparent); }
.sb-grabber{ display:block; width:44px; height:4px; background:var(--fg-3); opacity:.4; margin:0 auto 8px; }
.sb-sheetrow{ display:flex; align-items:center; justify-content:space-between; }
.sb-sheettitle{ font-family:var(--font-display); font-size:30px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; color:var(--fg-1); line-height:1; }
.dd-close,.d-close{ width:44px; height:44px; flex:none; display:grid; place-items:center; color:var(--fg-2); background:var(--tone); clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px); transition:background .16s var(--ease); }
.dd-close:hover,.d-close:hover{ background:var(--tone-2); }
.sb-toggle{ display:flex; align-items:center; gap:12px; min-height:52px; padding:0 14px; font-size:15px; font-weight:700; color:var(--fg-1); cursor:pointer; background:var(--panel); border-radius:14px; }
.sb-toggle input{ accent-color:var(--accent); width:20px; height:20px; }

.sb-applywrap{ position:sticky; bottom:0; margin:6px calc(var(--pad) * -1) 0; padding:16px var(--pad) calc(14px + env(safe-area-inset-bottom,0px)); background:linear-gradient(transparent, var(--paper) 36%); }

/* ===== BARRA INFERIOR ===== */

}

.tb-item:active{ transform:scale(.94); }

.tb-ico{ position:relative; display:flex; }
.tb-badge{ position:absolute; top:-7px; right:-12px; min-width:18px; height:18px; padding:0 5px; background:var(--rose); color:var(--rose-ink); font-family:var(--font-display); font-size:13px; font-style:normal; font-weight:700; display:flex; align-items:center; justify-content:center; clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%); }
.tb-new{ color:var(--on-navy); }
.tb-plus{ width:42px; height:30px; display:flex; align-items:center; justify-content:center; background:var(--sky); color:var(--sky-ink); clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%); }

/* ===== FICHA DE CARTA · hoja inferior con selector fijo ===== */
.overlay{ position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center; background:rgba(10,9,20,.55); opacity:0; transition:opacity .22s var(--ease); }

  width:100%; max-width:660px; max-height:94dvh; overflow-y:auto; overscroll-behavior:contain; background:var(--paper);
  clip-path:polygon(var(--cut-l) 0,100% 0,100% 100%,0 100%,0 var(--cut-l));
  opacity:0; transform:translateY(24px); transition:opacity .22s var(--ease-out), transform .3s var(--ease-out);
}
.overlay.in .detail{ opacity:1; transform:none; }
.detail::before{ content:""; display:block; width:44px; height:4px; background:var(--fg-3); opacity:.4; margin:10px auto 0; }
.d-head{ display:grid; grid-template-columns:44px 1fr 44px; align-items:start; gap:14px 10px; padding:14px var(--pad) 12px; }

.d-kpi{ background:var(--panel); padding:8px 12px 10px; border-radius:12px; }

.d-stepper{ position:sticky; bottom:0; z-index:3; display:grid; grid-template-columns:1fr 52px 56px 52px; align-items:center; gap:0; margin-top:12px; padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom,0px)); background:var(--paper); box-shadow:0 -1px 0 var(--line); order:9; }

.detail{ display:flex; flex-direction:column; }
.d-body{ padding:14px var(--pad) 8px; display:flex; flex-direction:column; gap:14px; }
.d-fieldrow{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px 16px; }
.d-field .fl{ font-family:var(--font-display); font-size:13px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-3); }

/* ===== MIS MAZOS · página oscura ===== */
.decksPage{
  --panel:#1d1a38; --tone:#2b2650; --line:#39335f; --fg-1:#f0f4f8; --fg-2:#cfe0f0; --fg-3:#93a3c4;
  position:fixed; left:0; right:0; bottom:0; top:var(--top-h); z-index:35; overflow-y:auto; overscroll-behavior:contain; color:var(--fg-2); color-scheme:dark;
  background:radial-gradient(700px 420px at 90% -10%, rgba(62,112,124,.45), transparent 62%), #15122a;
  animation:dpIn .32s var(--ease-out);
}
@keyframes dpIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
.decksPage::before{
  content:""; position:fixed; left:0; right:0; bottom:0; height:min(118vw,640px); z-index:0; pointer-events:none;
  background:url("assets/decks-hero.webp") 60% 28% / cover no-repeat;
  opacity:.42; mix-blend-mode:luminosity;

}
.dp-inner{ position:relative; z-index:1; }
.dp-inner{ max-width:1240px; margin:0 auto; padding:16px var(--pad) calc(var(--tab-total) + 32px); display:flex; flex-direction:column; gap:18px; }
.dp-back{ align-self:flex-start; display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px 0 12px; font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-2); background:rgba(255,255,255,.07); clip-path:polygon(8px 0,100% 0,100% 100%,0 100%,0 8px); transition:background .15s var(--ease); }
.dp-back:hover{ background:rgba(255,255,255,.13); }
#dpList,#dpDetail{ display:flex; flex-direction:column; gap:20px; }
.dp-head{ display:flex; flex-direction:column; gap:4px; }
.dp-eyebrow{ font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--sky); font-variant-numeric:tabular-nums; }
.dp-eyebrow .warn{ color:var(--rose); }
.dp-title{ font-family:var(--font-display); font-size:clamp(36px,11vw,56px); font-weight:700; line-height:.95; text-transform:uppercase; letter-spacing:.005em; color:var(--fg-1); text-wrap:balance; }
.dp-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; margin-top:4px; }
.dp-deck,.dp-new{ min-height:156px; }
.dp-deck{
  position:relative; padding:14px 14px 12px; cursor:pointer; display:flex; flex-direction:column; gap:12px;
  background:color-mix(in srgb, var(--accent) 22%, #1d1a38);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  transition:transform .22s var(--ease-out), background .2s var(--ease);
}

.dp-deck:focus-visible{ outline:3px solid var(--sky); outline-offset:-3px; }

.dp-new:hover,.dp-new:focus-visible{ color:var(--sky); background:rgba(139,205,255,.08); }
.dp-dhead{ flex-direction:column; gap:14px; }
.dp-dtitle{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.dp-name{ width:100%; min-height:48px; border:0; outline:0; background:transparent; font-family:var(--font-display); font-size:clamp(32px,9vw,46px); font-weight:700; letter-spacing:.01em; text-transform:uppercase; color:var(--fg-1); line-height:1; box-shadow:inset 0 -2px 0 var(--line); transition:box-shadow .15s var(--ease); }

.cmp-empty{ text-align:center; color:var(--fg-3); font-size:14px; padding:60px 20px; width:100%; }
.cmp-col{ flex:0 0 min(78vw,280px); scroll-snap-align:start; background:var(--panel); padding:14px; display:flex; flex-direction:column; gap:10px; clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut)); }
.cmp-col h3{ font-family:var(--font-display); font-size:22px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--fg-1); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cmp-stats{ display:flex; flex-wrap:wrap; gap:5px; }
.cmp-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; padding:6px 0; box-shadow:inset 0 -1px 0 var(--tone); }
.cmp-row .n{ color:var(--fg-1); font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cmp-row .q{ color:var(--fg-3); font-weight:700; flex:none; }

/* ===== TABLET ===== */
@media (min-width:560px){
  :root{ --pad:20px; }
  .grid{ grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .dp-grid{ grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
  .dp-cols{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .d-fieldrow{ grid-template-columns:repeat(4,auto); justify-content:start; gap:12px 28px; }
}
@media (min-width:640px){
  .overlay{ align-items:center; padding:24px; }
  .detail{ max-height:90dvh; clip-path:polygon(var(--cut-l) 0,100% 0,100% calc(100% - var(--cut-l)),calc(100% - var(--cut-l)) 100%,0 100%,0 var(--cut-l)); }
  .detail::before{ display:none; }
  .d-head{ grid-template-columns:240px 1fr 44px; gap:20px; padding:22px var(--pad) 16px; }
  .d-img{ grid-column:1; width:240px; }
  .d-titlewrap{ grid-column:2; grid-row:1; align-self:end; }
  .d-name{ font-size:42px; }
  .cmpModal{ inset:24px; margin:auto; max-width:960px; max-height:88vh; width:calc(100% - 48px); clip-path:polygon(var(--cut-l) 0,100% 0,100% calc(100% - var(--cut-l)),calc(100% - var(--cut-l)) 100%,0 100%,0 var(--cut-l)); }
  .cmp-col{ flex:1 0 220px; max-width:260px; }
}

/* ===== INSTALAR COMO APP ===== */
html{ touch-action:manipulation; }
@media (display-mode:standalone){ html,body{ overscroll-behavior-y:none; } }
.installCard{ display:none; }
@media (max-width:899px){
  .installCard:not([hidden]){
    position:fixed; z-index:37; left:var(--pad); right:var(--pad); bottom:calc(var(--tab-total) + 10px);
    display:grid; grid-template-columns:44px minmax(0,1fr); gap:6px 12px; align-items:center;
    padding:12px 12px 10px; background:var(--navy); color:var(--on-navy);
    box-shadow:inset 0 2px 0 rgba(139,205,255,.4), 0 14px 30px -12px rgba(10,9,20,.6);
    animation:icIn .45s var(--ease-out);
  }
}
@keyframes icIn{ from{ opacity:0; transform:translateY(14px); } to{ opacity:1; transform:none; } }
.installCard img{ grid-column:1; grid-row:1; width:44px; height:44px; display:block; }
.ic-text{ grid-column:2; grid-row:1; display:flex; flex-direction:column; min-width:0; }
.ic-text b{ font-size:14px; font-weight:700; color:#fff; }
.ic-text span{ font-size:12.5px; line-height:1.4; color:var(--on-navy-2); }
.ic-actions{ grid-column:1 / -1; display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
.ic-primary,.ic-ghost{ min-height:44px; padding:0 18px; border:0; cursor:pointer; font:inherit; font-size:13px; font-weight:700; }
.ic-primary{ background:var(--sky); color:var(--sky-ink); clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px); }
.ic-ghost{ background:transparent; color:var(--on-navy-2); }
.ic-primary:active,.ic-ghost:active{ transform:scale(.96); }

/* ===== DESCARGA PARA USO SIN CONEXIÓN ===== */
.warmToast{
  position:fixed; z-index:44; left:0; right:0; margin-inline:auto; top:calc(var(--top-h) + 10px); width:min(92vw,380px);
  padding:9px 14px 11px; background:var(--navy); color:var(--on-navy); font-size:12.5px; font-weight:700; line-height:1.3;
  box-shadow:inset 0 2px 0 rgba(139,205,255,.4), 0 12px 26px -10px rgba(10,9,20,.6); animation:icIn .35s var(--ease-out);
}
.wt-bar{ display:block; height:3px; margin-top:7px; background:rgba(139,205,255,.2); }
.wt-bar b{ display:block; height:100%; width:0; background:var(--sky); transition:width .3s var(--ease); }

  .db-top{ padding-inline:24px; }
  .db-top-logo img{ height:36px; }
  .db-body{ display:grid; grid-template-columns:268px minmax(0,1fr); align-items:start; }

  .db-main{ padding:26px var(--pad) 56px; gap:18px; }
  .findbar{ position:static; margin:0; padding:0; background:none; }
  .searchbar{ gap:14px; padding:4px 4px 4px 22px; }
  .sb-eyebrow{ display:block; font-family:var(--font-display); font-size:17px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-1); white-space:nowrap; }
  .sb-div{ display:block; width:1px; height:22px; background:var(--line); flex:none; }
  .addfilter-btn{ display:flex; align-items:center; gap:8px; min-height:44px; padding:0 18px 0 14px; background:var(--accent); color:#fff; font-size:14px; font-weight:700; white-space:nowrap; flex:none; clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%); transition:background .16s var(--ease); }
  .addfilter-btn:hover{ background:var(--accent-ink); }
  .quick{ display:none; }
  .grid{ grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:12px; }
  .dz-inner{ --cut:14px; }
  .dz-inner:hover{ transform:translateY(-4px); }
  .dz-inner:hover .card-imgwrap img{ transform:scale(1.035); }
  .deck-stepper{ grid-template-columns:38px 1fr 38px; }
  .ds-btn{ width:38px; height:38px; }
  .ds-count{ font-size:22px; }
  .pa-row{ margin-top:18px; }
  .pageActions{ flex:none; }
  .pa-btn{ flex:none; padding:0 26px; min-height:52px; }
  .pa-sep{ display:none; }
  .adp-card{ max-width:560px; }
  .tag.chip{ min-height:34px; padding:6px 14px; }
  .sb-tagwrap.open > *{ max-height:380px; }
  .d-stepper{ margin-top:8px; }
  .dp-inner{ padding:24px var(--pad) 64px; }
  .dp-grid{ gap:12px; }
  .dp-dhead{ flex-direction:row; align-items:flex-end; justify-content:space-between; }
  .dp-dtitle{ flex:1; min-width:220px; }
  .dp-actions{ flex:none; }
  .dp-btn{ flex:none; }
  .dp-cols{ grid-template-columns:repeat(4,minmax(0,1fr)); }
}
@media (min-width:900px) and (max-width:1100px){ .dp-cols{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:359px){

  .pa-btn{ font-size:13px; padding:0 6px; }

}

  function buildFilters(){

      keys.forEach(function(s){
        var b = chip(s, function(btn){ toggle(state.sets,s); btn.classList.toggle('active'); });

      });

    }
    buildSetGroup(SET_KEYS.filter(function(s){return s.indexOf('ST')===0;}), t().setStarterLbl);
    buildSetGroup(SET_KEYS.filter(function(s){return s.indexOf('GD')===0;}), t().setExpansionLbl);
    buildSetGroup(SET_KEYS.filter(function(s){return s.indexOf('EB')===0;}), t().setExtraLbl);

    COLOR_ORDER.forEach(function(c){
      if(!ALL.some(function(x){return x.color===c;})) return;
      var b = chip(t().colors[c]||c, function(btn){ toggle(state.colors,c); btn.classList.toggle('active'); }, {color:c});
      b.classList.toggle('active', state.colors.has(c));

    var typeBox = document.getElementById('f-type'); typeBox.innerHTML = '';

      typeBox.appendChild(b);

    var counts = {};

    var tagBox = document.getElementById('f-tag'); tagBox.innerHTML = '';
    Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).forEach(function(tg){
      var b = chip((t().tags[tg]||tg)+' · '+counts[tg], function(btn){ toggle(state.tags,tg); btn.classList.toggle('active'); });
      b.classList.toggle('active', state.tags.has(tg));

    var traitCounts = {};

  function toggle(set,val){ if(set.has(val)) set.delete(val); else set.add(val); }

  function matches(c){
    if(state.ownedOnly && !c.owned) return false;
    if(state.sets.size && !state.sets.has(c.set)) return false;
    if(state.colors.size && !state.colors.has(c.color)) return false;
    if(state.types.size && !state.types.has(c.type)) return false;
    if(state.tags.size){ var ok=false; state.tags.forEach(function(tg){ if(c.tags.indexOf(tg)!==-1) ok=true; }); if(!ok) return false; }
    if(state.traits.size){ var okT=false; var tl=traitList(c); state.traits.forEach(function(tr){ if(tl.indexOf(tr)!==-1) okT=true; }); if(!okT) return false; }
    if(state.search){
      var q = state.search.toLowerCase();
      var hay = (c.name+' '+c.number+' '+c.effect+' '+(c.effect_es||'')+' '+c.trait).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  }

  function tile(card){
    var dz = el('div','dz');
    var inner = el('div','dz-inner');
    inner.tabIndex = 0;
    inner.setAttribute('role','button');
    inner.setAttribute('aria-label', card.name+' · '+card.number+' · '+(card.owned?t().tengo:t().falta));
    inner.onclick = function(){ openDetail(card); };
    inner.addEventListener('keydown', function(e){
      if((e.key==='Enter'||e.key===' ') && e.target===inner){ e.preventDefault(); openDetail(card); }
    });
    var bit = el('div','colorbit'); bit.dataset.color = card.color; inner.appendChild(bit);
    var status = el('div','delta '+(card.owned?'delta-up':'delta-dn')+' status', card.owned?t().tengo:t().falta);
    inner.appendChild(status);
    var imgwrap = el('div','card-imgwrap');
    var img = document.createElement('img'); img.loading='lazy'; img.src='images/'+card.number+'.webp'; img.alt=card.name;
    imgwrap.appendChild(img); inner.appendChild(imgwrap);
    var body = el('div','card-body');
    body.appendChild(stepperEl(card.number));
    var tags = el('div','card-tagrow');
    card.tags.slice(0,2).forEach(function(tg){ tags.appendChild(el('span','tag', t().tags[tg]||tg)); });
    body.appendChild(tags);
    inner.appendChild(body);
    dz.appendChild(inner);
    return {dz:dz, inner:inner};
  }

  function render(){
    var filtered = ALL.filter(matches);

        var tl = tile(c);
        frag.appendChild(tl.dz);

          tl.inner.classList.add('enter');
          tl.inner.style.animationDelay = (i * 18) + 'ms';

      grid.appendChild(frag);

  function closeSidebar(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); updateTabbar(); }
  document.getElementById('addFilterBtn').addEventListener('click', function(){
    if(window.matchMedia('(max-width:899px)').matches){ openSidebar(); return; }
    document.querySelectorAll('.sb-tagwrap').forEach(function(w){ w.classList.add('open'); });
    document.querySelectorAll('.sb-ghead[data-toggle]').forEach(function(h){ h.setAttribute('aria-expanded','true'); });
    sidebar.scrollTo({top:0, behavior:'smooth'});
  });
  scrim.addEventListener('click', closeSidebar);
  document.getElementById('sbClose').addEventListener('click', closeSidebar);
  document.getElementById('sbApply').addEventListener('click', function(){
    closeSidebar();
    window.scrollTo({top:0, behavior:'smooth'});
  });

  function updateTabbar(){
    var active = !document.getElementById('decksPage').hidden ? 'tbDecks' : sidebar.classList.contains('open') ? 'tbFilters' : 'tbCatalog';
    ['tbCatalog','tbFilters','tbDecks'].forEach(function(id){
      var b = document.getElementById(id);
      b.classList.toggle('is-active', id===active);
      if(id===active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
  }
  document.getElementById('homeLogo').addEventListener('click', function(e){
    e.preventDefault();
    if(!document.getElementById('overlay').hidden) closeDetail();
    if(!cmpModal.hidden) closeCompareModal();
    if(!pillMenu.hidden) closePillMenu();
    closeSidebar();
    if(!document.getElementById('decksPage').hidden) closeDecksPage();
    selectDeckAction(null);
    window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('tbCatalog').addEventListener('click', function(){
    var wasHome = document.getElementById('decksPage').hidden && !sidebar.classList.contains('open');
    closeSidebar();
    if(!document.getElementById('decksPage').hidden) closeDecksPage();
    if(wasHome) window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('tbFilters').addEventListener('click', function(){
    if(sidebar.classList.contains('open')){ closeSidebar(); return; }
    if(!document.getElementById('decksPage').hidden) closeDecksPage();
    openSidebar();
  });
  document.getElementById('tbNew').addEventListener('click', function(){
    closeSidebar();
    if(!document.getElementById('decksPage').hidden) closeDecksPage();
    window.scrollTo({top:0, behavior:'smooth'});
    openAddDeckPanel();
  });
  document.getElementById('tbDecks').addEventListener('click', function(){ closeSidebar(); openDecksPage(); });

  /* Acordeón Añadir mazo / Ver mis mazos: solo uno seleccionado */
  var btnAdd = document.getElementById('btnAddDeck'), btnMy = document.getElementById('btnMyDecks');
  var addPanel = document.getElementById('addDeckPanel'), newDeckInput = document.getElementById('newDeckName');
  function selectDeckAction(which){
    var addOpen = which==='add';
    btnAdd.classList.toggle('is-selected', addOpen);
    btnAdd.setAttribute('aria-expanded', String(addOpen));
    btnMy.classList.toggle('is-selected', which==='my');
    btnMy.setAttribute('aria-pressed', String(which==='my'));
    addPanel.classList.toggle('open', addOpen);
    addPanel.inert = !addOpen;
  }
  function openAddDeckPanel(){
    selectDeckAction('add');
    newDeckInput.value = '';
    newDeckInput.focus({preventScroll:true});
  }
  btnAdd.addEventListener('click', function(){
    if(btnAdd.classList.contains('is-selected')) selectDeckAction(null); else openAddDeckPanel();
  });
  btnMy.addEventListener('click', openDecksPage);
  document.getElementById('addDeckForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = newDeckInput.value.trim() || (t().deckNewName+' '+(Object.keys(DECKS).length+1));
    activeDeckId = createDeck(name);
    newDeckInput.value = ''; newDeckInput.blur();
    selectDeckAction(null);
    setBuilding(true);
    saveDecksToStorage(); render(); updateDeckPill();
    var bar = document.getElementById('buildBar');
    bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
  });
  document.getElementById('bbView').addEventListener('click', function(){
    openDecksPage(); openDeckDetail(activeDeckId);
  });
  document.getElementById('bbClose').addEventListener('click', function(){ setBuilding(false); });

  /* Página Mis mazos */
  var decksPage = document.getElementById('decksPage');
  document.getElementById('dpBack').addEventListener('click', function(){
    if(dpDeckId){ dpDeckId = null; showDpView(); decksPage.scrollTop = 0; } else closeDecksPage();
  });
  document.getElementById('dpName').addEventListener('input', function(e){
    if(!DECKS[dpDeckId]) return;
    DECKS[dpDeckId].name = e.target.value; saveDecksToStorage();
  });
  document.getElementById('dpAddCards').addEventListener('click', goAddCards);
  document.getElementById('dpCopy').addEventListener('click', function(){
    if(!DECKS[dpDeckId]) return;
    var text = deckAsText(DECKS[dpDeckId]);
    var label = document.getElementById('lblDpCopy');
    function done(){ label.textContent = t().deckCopied; setTimeout(function(){ label.textContent = t().deckCopy; }, 1400); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  });

  /* Menú del pill */
  var pillMenu = document.getElementById('pillMenu');
  function openPillMenu(){ pillMenu.hidden = false; requestAnimationFrame(function(){ pillMenu.classList.add('open'); }); }
  function closePillMenu(){ pillMenu.classList.remove('open'); setTimeout(function(){ pillMenu.hidden = true; }, 160); }
  document.getElementById('deckPill').addEventListener('click', function(e){
    e.stopPropagation();
    if(pillMenu.hidden) openPillMenu(); else closePillMenu();
  });
  document.addEventListener('click', function(e){
    if(!pillMenu.hidden && !e.target.closest('.pillWrap')) closePillMenu();
  });
  document.getElementById('pmNewDeck').addEventListener('click', function(){
    closePillMenu();
    if(!decksPage.hidden){
      var id = createDeck(t().deckNewName+' '+(Object.keys(DECKS).length+1));
      openDeckDetail(id);
      var ni = document.getElementById('dpName'); ni.focus(); ni.select();
    } else {
      window.scrollTo({top:0, behavior:'smooth'});
      openAddDeckPanel();
    }
  });
  document.getElementById('pmMyDecks').addEventListener('click', function(){ closePillMenu(); openDecksPage(); });
  document.getElementById('pmCompare').addEventListener('click', function(){ closePillMenu(); openCompareModal(); });

  var cmpScrim = document.getElementById('cmpScrim'), cmpModal = document.getElementById('cmpModal');
  function openCompareModal(){
    renderCompare();
    cmpScrim.hidden = false; cmpModal.hidden = false;
    requestAnimationFrame(function(){ cmpScrim.classList.add('show'); cmpModal.classList.add('open'); });
  }
  function closeCompareModal(){
    cmpScrim.classList.remove('show'); cmpModal.classList.remove('open');
    setTimeout(function(){ cmpScrim.hidden = true; cmpModal.hidden = true; }, 220);
  }
  document.getElementById('cmpCloseBtn').addEventListener('click', closeCompareModal);
  cmpScrim.addEventListener('click', closeCompareModal);

  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape') return;
    if(pillMenu.classList.contains('open')){ closePillMenu(); return; }
    if(!cmpModal.hidden){ closeCompareModal(); return; }
    if(!document.getElementById('overlay').hidden){ closeDetail(); return; }
    if(sidebar.classList.contains('open')){ closeSidebar(); return; }
    if(!decksPage.hidden) document.getElementById('dpBack').click();
  });

  /* ===== Instalar como app (PWA) ===== */
  var installCard = document.getElementById('installCard');
  var installBtn = document.getElementById('installBtn'), installLater = document.getElementById('installLater');
  var deferredInstall = null;
  function isStandalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform)); }
  function isMobileDevice(){ return isIOS() || /android|mobile/i.test(navigator.userAgent); }
  function installDismissed(){
    try{ var d = +localStorage.getItem('msa_install_dismissed'); return !!d && Date.now() - d < 14 * 864e5; }catch(e){ return false; }
  }
  function renderInstall(){
    document.getElementById('installTitle').textContent = t().installTitle;
    document.getElementById('installBody').textContent = deferredInstall ? t().installBodyPrompt : isIOS() ? t().installBodyIOS : t().installBodyMenu;
    installBtn.hidden = !deferredInstall;
    installBtn.textContent = t().installBtn;
    installLater.textContent = deferredInstall ? t().installLater : t().installGotIt;
  }
  function showInstallCard(){
    if(isStandalone() || !isMobileDevice() || installDismissed()) return;
    renderInstall(); installCard.hidden = false;
  }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredInstall = e; if(!installCard.hidden) renderInstall(); });
  window.addEventListener('appinstalled', function(){ deferredInstall = null; installCard.hidden = true; });
  installBtn.addEventListener('click', function(){
    if(!deferredInstall) return;
    deferredInstall.prompt();
    deferredInstall.userChoice.then(function(){ deferredInstall = null; installCard.hidden = true; });
  });
  installLater.addEventListener('click', function(){
    installCard.hidden = true;
    try{ localStorage.setItem('msa_install_dismissed', String(Date.now())); }catch(e){}
  });
  setTimeout(showInstallCard, 6000);

  if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
    var warmToast = document.getElementById('warmToast'), warmText = document.getElementById('warmText'), warmFill = document.getElementById('warmFill');
    var warmTimer = null;
    function showWarm(done, total){
      clearTimeout(warmTimer);
      warmToast.hidden = false;
      warmText.textContent = t().warmProgress(done, total);
      warmFill.style.width = Math.min(100, done / total * 100) + '%';
    }
    function hideWarm(){ warmToast.hidden = true; }
    navigator.serviceWorker.addEventListener('message', function(e){
      var d = e.data || {};
      if(d.type === 'warm-progress') showWarm(d.done, d.total);
      else if(d.type === 'warm-done'){
        if(!d.skipped && !d.failed){
          warmFill.style.width = '100%'; warmText.textContent = t().warmDone; warmToast.hidden = false;
          warmTimer = setTimeout(hideWarm, 3500);
        } else hideWarm();
        if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
      }
    });
    function startWarm(){
      var conn = navigator.connection;
      if((conn && conn.saveData) || navigator.onLine === false) return;
      navigator.serviceWorker.ready.then(function(reg){
        if(!reg.active) return;
        var urls = ALL.slice().sort(function(a, b){ return (b.owned ? 1 : 0) - (a.owned ? 1 : 0); })
          .map(function(c){ return '/images/' + c.number + '.webp'; });
        reg.active.postMessage({type:'warm-images', urls:urls});
      });
    }
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('/sw.js').then(function(){ setTimeout(startWarm, 2500); }).catch(function(){});
    });
  }

  try{
    ALL = CARDS_DATA;
    loadDecksFromStorage();
    applyStaticI18n();
    buildFilters();
    render();
    updateDeckPill();
    if(new URLSearchParams(location.search).get('view') === 'decks') openDecksPage();
  }catch(err){
    document.getElementById('grid').innerHTML = '<div class="empty">'+(LANG==='es'?'No se pudieron cargar los datos: ':'Could not load data: ')+err+'</div>';
  }
})();
</script>
