<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221e41">
<meta name="color-scheme" content="only light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MS Archive">
<title>Mobile Suit Archive</title>
<meta name="description" content="Catálogo personal de las cartas de Gundam Card Game en tu colección (ST01–ST04) y en los sobres GD01/GD05, con ficha completa y categoría de habilidad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@300;400;500;700;900&family=Big+Shoulders+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== DESIGN TOKENS (paleta personal, estilo Soft Structuralism) ===== */
:root{
  --bg-primary:#f2f4f6; --bg-surface:#f7f9f9; --bg-mid:#221e41; --bg-card:#dce5ed; --bg-card-hover:#cdd9e5;
  --fg-1:#221e41; --fg-2:#2e4a62; --fg-3:#5a7a94;
  --fg-footer-1:#f0f4f8; --fg-footer-2:#cfe0f0; --fg-footer-3:#7a9ab8;
  --accent:#3e707c; --accent-light:#8bcdff; --accent-green:#b1c28c; --accent-teal:#86bfc6; --accent-rose:#f4a6a6;
  --border:#c4d3df; --border-accent:#3e707c; --border-light:#dce5ed;
  --font-sans:'Zen Kaku Gothic New','Noto Sans JP',system-ui,-apple-system,sans-serif;
  --font-display:'Big Shoulders Display',var(--font-sans);
  --ease:cubic-bezier(0.32,0.72,0,1); --ease-b:cubic-bezier(0.16,1,0.3,1);
  --shadow-in: inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(34,30,65,.04);
  color-scheme: only light;
  --c-blue:#3b6ea5; --c-green:#5c8a63; --c-red:#b5544a; --c-purple:#8a6bab; --c-white:#aeb4c2;
  /* glass */
  --ambient-base:#e9eef4;
  --ambient-1:rgba(62,112,124,.38); --ambient-2:rgba(139,205,255,.52); --ambient-3:rgba(138,107,171,.24);
  --glass-bg:rgba(255,255,255,.52); --glass-bg-strong:rgba(255,255,255,.74);
  --glass-border:rgba(255,255,255,.75); --glass-hairline:rgba(34,30,65,.08);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.9), 0 14px 34px -20px rgba(34,30,65,.38);
  --glass-blur:saturate(160%) blur(18px);
  --glass-dark:rgba(28,24,56,.78); --glass-dark-border:rgba(139,205,255,.16);
  --grid-line:rgba(62,112,124,.075);
  --tabbar-h:64px;
}

*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  font-family:var(--font-sans); color:var(--fg-2);
  background:
    radial-gradient(55vw 55vh at 92% -8%, var(--ambient-1), transparent 62%),
    radial-gradient(48vw 50vh at -8% 38%, var(--ambient-2), transparent 62%),
    radial-gradient(42vw 45vh at 58% 112%, var(--ambient-3), transparent 64%),
    var(--ambient-base);
  -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
  line-height:1.5; margin:0; padding-inline:0 !important;
}
img{ max-width:100%; }
[hidden]{ display:none !important; }
::-webkit-scrollbar{ width:9px; height:9px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:5px; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  .dz-inner{ opacity:1 !important; transform:none !important; }
}

/* ===== TYPE ROLES ===== */
.eyebrow{ font-family:var(--font-sans); font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-3); }
.num{ font-variant-numeric:tabular-nums; }
h1,h2,h3{ font-family:var(--font-sans); margin:0; }

/* ===== CAPSULE TAG ===== */
.tag{
  font-family:var(--font-sans); font-size:9.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
  padding:3.5px 10px; border-radius:9999px; border:none; background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent);
  transition:background .18s var(--ease); white-space:nowrap; cursor:default;
}
.tag.hi{ background:var(--accent); color:#fff; font-weight:700; }
.tag.chip{ cursor:pointer; background:var(--bg-card); color:var(--fg-2); }
.tag.chip:hover{ background:var(--bg-card-hover); }
.tag.chip.active{ background:var(--accent); color:#fff; }
.tag.chip[data-color="Blue"].active{ background:var(--c-blue); }
.tag.chip[data-color="Green"].active{ background:var(--c-green); }
.tag.chip[data-color="Red"].active{ background:var(--c-red); }
.tag.chip[data-color="Purple"].active{ background:var(--c-purple); }
.tag.chip[data-color="White"].active{ background:var(--c-white); color:#221e41; }
.tag.removable{ display:inline-flex; align-items:center; gap:5px; background:color-mix(in srgb, var(--accent) 16%, transparent); color:var(--accent); }
.tag.removable button{ all:unset; cursor:pointer; font-size:11px; line-height:1; opacity:.7; }
.tag.removable button:hover{ opacity:1; }

/* ===== DELTA BADGE (owned / need) ===== */
.delta{ display:inline-flex; align-items:center; gap:4px; font-size:9px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:3px 8px; border-radius:9999px; border:none; }
.delta-up{ background:rgba(139,205,255,.85); color:#0e2338; }
.delta-dn{ background:rgba(244,166,166,.9); color:#5c1f1f; }

/* ===== DASHBOARD SHELL ===== */
.db-wrap{ display:grid; grid-template-rows:64px 1fr; height:100%; min-height:100dvh; }
/* retícula de plano técnico + grano: la atmósfera que refracta el cristal */
body::before, body::after{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; }
body::before{
  background-image:linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size:44px 44px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 62% 28%, #000 15%, transparent 78%);
          mask-image:radial-gradient(ellipse 85% 75% at 62% 28%, #000 15%, transparent 78%);
}
body::after{
  opacity:.5; mix-blend-mode:soft-light;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.db-top{
  position:relative; z-index:36; display:flex; align-items:center; gap:16px;
  padding:0 20px; padding-top:env(safe-area-inset-top,0px); min-height:64px;
  background:linear-gradient(180deg, rgba(34,30,65,.94), rgba(34,30,65,.84));
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border-bottom:1px solid var(--glass-dark-border);
  box-shadow:0 10px 30px -18px rgba(10,9,20,.6);
}
.db-top-logo img{ height:36px; width:auto; display:block; filter:drop-shadow(0 0 1px rgba(0,0,0,.2)); }

.pageTitle{ margin:2px 0 2px; }
.pageTitle h1{
  font-family:var(--font-sans); font-size:clamp(26px,4vw,45px); font-weight:500; line-height:1.12;
  letter-spacing:-.01em; color:var(--fg-1); margin:0; text-wrap:balance;
}
.pa-row{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:14px; }
.avatar{
  flex:none; width:60px; height:60px; border-radius:50%; padding:3px; position:relative;
  background:conic-gradient(from 210deg, var(--accent-light), var(--accent), #8a6bab, var(--accent-light));
  box-shadow:0 12px 26px -12px rgba(34,30,65,.6), 0 0 0 4px var(--glass-bg);
}
.avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; border:2px solid var(--ambient-base); }
.avatar::after{
  content:""; position:absolute; right:2px; bottom:3px; width:13px; height:13px; border-radius:50%;
  background:#6fdc8c; border:2.5px solid var(--ambient-base);
}
.pageActions{
  display:inline-flex; gap:4px; padding:5px; border-radius:9999px; max-width:100%;
  background:var(--glass-dark); border:1px solid var(--glass-dark-border);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 14px 30px -16px rgba(34,30,65,.75);
}
.pa-btn{
  all:unset; box-sizing:border-box; display:flex; align-items:center; gap:8px; cursor:pointer; white-space:nowrap;
  font-family:var(--font-sans); font-size:13px; font-weight:700; padding:11px 20px; border-radius:9999px;
  background:transparent; color:var(--fg-footer-2);
  transition:background .2s var(--ease), color .2s var(--ease), box-shadow .2s var(--ease), opacity .25s var(--ease);
}
.pa-btn:hover{ background:rgba(255,255,255,.08); color:#fff; }
.pa-btn:focus-visible{ outline:2px solid var(--accent-light); outline-offset:2px; }
.pa-btn.is-selected{ background:var(--accent-light); color:#0e2338; box-shadow:0 6px 18px -6px rgba(139,205,255,.75); }
.pageActions:has(.is-selected) .pa-btn:not(.is-selected){ opacity:.42; }
.pageActions:has(.is-selected) .pa-btn:not(.is-selected):hover{ opacity:.8; }
.pa-ico{
  width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:rgba(139,205,255,.2); color:var(--accent-light); transition:background .2s var(--ease), color .2s var(--ease);
}
.pa-btn.is-selected .pa-ico{ background:rgba(14,35,56,.14); color:#0e2338; }
.pa-sep{ width:1px; align-self:stretch; margin:9px 2px; flex:none; background:rgba(207,224,240,.2); transition:opacity .2s var(--ease); }
.pageActions:has(.is-selected) .pa-sep{ opacity:0; }
@media (max-width:420px){ .pa-btn{ padding:10px 14px; font-size:12.5px; gap:6px; } }
.addDeckPanel{ display:grid; grid-template-rows:0fr; opacity:0; transition:grid-template-rows .32s var(--ease-b), opacity .22s var(--ease); }
.addDeckPanel.open{ grid-template-rows:1fr; opacity:1; }
.adp-inner{ min-height:0; overflow:hidden; }
.adp-card{
  margin-top:12px; max-width:560px; display:flex; flex-direction:column; gap:8px; border-radius:16px; padding:14px 16px;
  background:var(--glass-bg); box-shadow:var(--glass-shadow);
  border:1px solid color-mix(in srgb, var(--accent-light) 55%, transparent);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
}
.adp-label{ font-size:9px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-2); }
.adp-row{ display:flex; gap:8px; flex-wrap:wrap; }
.adp-input{
  flex:1; min-width:180px; border:1px solid var(--border); border-radius:9999px; background:var(--bg-surface); outline:none;
  font-family:var(--font-sans); font-size:14px; color:var(--fg-1); padding:9px 16px; transition:border-color .15s var(--ease);
}
.adp-input::placeholder{ color:var(--fg-3); }
.adp-input:focus{ border-color:var(--accent); }
.adp-submit{
  all:unset; box-sizing:border-box; cursor:pointer; padding:9px 18px; border-radius:9999px; background:var(--accent); color:#fff;
  font-family:var(--font-sans); font-size:12.5px; font-weight:700; transition:opacity .15s var(--ease);
}
.adp-submit:hover{ opacity:.9; }
.buildBar{
  display:flex; align-items:flex-end; justify-content:space-between; gap:10px 20px; flex-wrap:wrap;
  padding:2px 4px 0; animation:bbIn .45s var(--ease-b);
}
@keyframes bbIn{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:none; } }
.bb-main{ min-width:0; flex:1 1 200px; }
.bb-eyebrow{ display:flex; align-items:center; gap:7px; font-size:9px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); }
.bb-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent-light); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent-light) 30%, transparent); animation:bbPulse 2s ease-in-out infinite; }
@keyframes bbPulse{ 50%{ box-shadow:0 0 0 6px color-mix(in srgb, var(--accent-light) 0%, transparent); } }
.bb-name{ font-size:clamp(22px,3vw,32px); font-weight:500; line-height:1.15; letter-spacing:-.01em; color:var(--fg-1); margin-top:4px; overflow-wrap:anywhere; }
.bb-side{ display:flex; align-items:center; gap:14px; }
.bb-count{ font-size:12px; font-weight:600; color:var(--fg-3); font-variant-numeric:tabular-nums; }
.bb-count b{ font-family:var(--font-display); font-size:30px; font-weight:600; color:var(--fg-1); line-height:1; margin-right:2px; }
.bb-link{ all:unset; cursor:pointer; font-size:12px; font-weight:700; color:var(--accent); text-decoration:underline; text-underline-offset:3px; }

.db-body{ display:grid; grid-template-columns:240px 1fr; min-height:0; }
@media (max-width:860px){ .db-body{ grid-template-columns:1fr; } }

/* SIDEBAR */
.db-sidebar{
  background:linear-gradient(180deg, color-mix(in srgb, var(--glass-bg) 55%, transparent), transparent);
  padding:18px 14px 14px; display:flex; flex-direction:column; gap:12px;
  overflow-y:auto; overscroll-behavior:contain; border-right:1px solid var(--glass-border); min-height:0;
}
@media (max-width:860px){
  .db-sidebar{
    position:fixed; z-index:60; left:0; right:0; bottom:0; max-height:84dvh; padding:0 16px;
    border-radius:26px 26px 0 0; border:1px solid var(--glass-border); border-bottom:none;
    background:var(--glass-bg-strong);
    backdrop-filter:saturate(170%) blur(28px); -webkit-backdrop-filter:saturate(170%) blur(28px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 -24px 60px -24px rgba(10,9,20,.55);
    transform:translateY(105%); visibility:hidden; transition:transform .4s var(--ease-b), visibility 0s linear .4s;
  }
  .db-sidebar.open{ transform:none; visibility:visible; transition:transform .4s var(--ease-b), visibility 0s; }
}

.sb-group{
  display:flex; flex-direction:column; gap:0; border-radius:14px; padding:12px 13px;
  background:var(--glass-bg); border:1px solid var(--glass-border); box-shadow:var(--glass-shadow);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  transition:background .2s var(--ease), border-color .2s var(--ease);
}
.sb-group:has(.sb-tagwrap.open){ background:var(--glass-bg-strong); border-color:color-mix(in srgb, var(--accent-light) 45%, transparent); }
@media (hover:hover){ .sb-group:hover{ background:var(--glass-bg-strong); border-color:color-mix(in srgb, var(--accent-light) 45%, transparent); } }
.sb-group .eyebrow{ color:var(--fg-2); }
.sb-ghead{ display:flex; align-items:center; justify-content:space-between; gap:8px; cursor:pointer; }
.sb-chips{ display:flex; flex-wrap:wrap; gap:6px; }
#f-set{ display:flex; flex-direction:column; gap:6px; }
.sb-subhead{ font-size:8.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--fg-3); margin-top:2px; }
.sb-subhead:first-child{ margin-top:0; }
.sb-chips .tag{ background:var(--bg-card); color:var(--fg-2); }
.sb-chips .tag.active{ background:var(--accent-light); color:#0e2338; font-weight:700; }
.sb-chips .tag[data-color="Blue"].active{ background:var(--c-blue); color:#fff; }
.sb-chips .tag[data-color="Green"].active{ background:var(--c-green); color:#fff; }
.sb-chips .tag[data-color="Red"].active{ background:var(--c-red); color:#fff; }
.sb-chips .tag[data-color="Purple"].active{ background:var(--c-purple); color:#fff; }
.sb-chips .tag[data-color="White"].active{ background:var(--c-white); color:#221e41; }

.sb-toggle{
  display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:600; color:var(--fg-1); cursor:pointer;
  border-radius:14px; padding:12px 13px;
  background:var(--glass-bg); border:1px solid var(--glass-border); box-shadow:var(--glass-shadow);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
}
.sb-toggle input{ accent-color:var(--accent); width:15px; height:15px; }

.sb-chevron{ width:15px; height:15px; flex:none; color:var(--accent); transition:transform .25s var(--ease-b); }
@media (hover:hover){ .sb-group:hover .sb-chevron{ transform:rotate(180deg); } }
.sb-group:has(.sb-tagwrap.open) .sb-chevron{ transform:rotate(180deg); }
.sb-tagwrap{ max-height:0; overflow:hidden; transition:max-height .25s var(--ease-b), margin-top .25s var(--ease-b); display:flex; flex-direction:column; gap:6px; margin-top:0; }
.sb-tagwrap.open{ max-height:420px; overflow-y:auto; margin-top:10px; }
@media (hover:hover){ .sb-group:hover .sb-tagwrap{ max-height:420px; overflow-y:auto; margin-top:10px; } }

.sb-scrim{ display:none; }
@media (max-width:860px){ .sb-scrim.show{ display:block; position:fixed; inset:0; background:rgba(10,9,20,.42); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); z-index:55; } }

/* MAIN */
.db-main{
  padding:22px 24px 40px; overflow-y:auto; overscroll-behavior:contain; min-height:0; display:flex; flex-direction:column; gap:18px;
}

.resultbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.resultbar .count{ font-size:11.5px; color:var(--fg-3); font-weight:600; margin-right:2px; }
.resultbar .clearbtn{ all:unset; cursor:pointer; font-size:10.5px; font-weight:600; color:var(--accent); text-decoration:underline; text-underline-offset:2px; margin-left:auto; }

/* CARD GRID — double-bezel mini */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:14px; }
.grid:empty{ display:none; }
.dz{ min-width:0; }
.dz-inner{
  background:var(--glass-bg-strong); border:1px solid var(--glass-border); border-radius:18px; height:100%; overflow:hidden; position:relative;
  box-shadow:var(--glass-shadow); cursor:pointer; display:flex; flex-direction:column;
  transition:opacity .45s var(--ease-b), transform .35s var(--ease-b), box-shadow .25s var(--ease), border-color .25s var(--ease);
  opacity:0; transform:translateY(8px);
}
.dz-inner.in{ opacity:1; transform:none; }
@media (hover:hover){
  .dz-inner:hover{
    transform:translateY(-4px); border-color:color-mix(in srgb, var(--accent-light) 60%, transparent);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 22px 40px -22px color-mix(in srgb, var(--accent) 70%, transparent);
  }
  .dz-inner:hover .card-imgwrap img{ transform:scale(1.035); }
}
.dz-inner .status{ position:absolute; top:13px; right:13px; z-index:2; box-shadow:0 4px 12px -4px rgba(0,0,0,.35); }
.dz-inner .colorbit{ position:absolute; top:18px; left:0; width:4px; height:38px; border-radius:0 4px 4px 0; z-index:2; }
.dz-inner .colorbit[data-color="Blue"]{ background:var(--c-blue); } .dz-inner .colorbit[data-color="Green"]{ background:var(--c-green); }
.dz-inner .colorbit[data-color="Red"]{ background:var(--c-red); } .dz-inner .colorbit[data-color="Purple"]{ background:var(--c-purple); }
.dz-inner .colorbit[data-color="White"]{ background:var(--c-white); }
.card-imgwrap{ aspect-ratio:63/88; background:var(--bg-card); margin:7px 7px 0; border-radius:12px; overflow:hidden; box-shadow:0 6px 16px -10px rgba(0,0,0,.45); }
.card-imgwrap img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s var(--ease-b); }
.card-body{ padding:8px 10px 10px; display:flex; flex-direction:column; }
.card-tagrow{ display:flex; flex-wrap:wrap; gap:4px; }
.card-tagrow .tag{ font-size:8px; padding:2px 7px; }
.card-tagrow:empty{ display:none; }
.card-body:has(.card-tagrow:empty){ padding:0; }

.empty{ grid-column:1 / -1; text-align:center; padding:60px 20px; color:var(--fg-3); font-size:13px; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:18px; }

/* ===== DETAIL OVERLAY ===== */
.overlay{ position:fixed; inset:0; background:rgba(10,9,20,.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; z-index:40; opacity:0; transition:opacity .22s var(--ease); }
.overlay.in{ opacity:1; }
@media (min-width:640px){ .overlay{ align-items:center; padding:24px; } }
.overlay[hidden]{ display:none; }
.detail{
  background:var(--glass-bg-strong); border:1px solid var(--glass-border);
  backdrop-filter:saturate(170%) blur(28px); -webkit-backdrop-filter:saturate(170%) blur(28px);
  width:100%; max-width:660px; max-height:92vh; overflow-y:auto; overscroll-behavior:contain;
  border-radius:22px 22px 0 0; box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 30px 70px -20px rgba(0,0,0,.5);
  opacity:0; transform:translateY(14px) scale(.99); transition:opacity .22s var(--ease-b), transform .22s var(--ease-b);
}
.overlay.in .detail{ opacity:1; transform:none; }
@media (min-width:640px){ .detail{ border-radius:22px; } }
.d-head{ display:flex; gap:16px; padding:20px 20px 14px; }
.d-img{ width:118px; flex:none; border-radius:10px; overflow:hidden; background:var(--bg-card); aspect-ratio:63/88; box-shadow:var(--shadow-in); }
.d-img img{ width:100%; height:100%; object-fit:cover; }
.d-titlewrap{ flex:1; min-width:0; }
.d-eye{ display:flex; align-items:center; gap:7px; margin-bottom:8px; flex-wrap:wrap; }
.d-name{ font-size:20px; font-weight:700; letter-spacing:-.02em; color:var(--fg-1); line-height:1.15; }
.d-close{ all:unset; cursor:pointer; align-self:flex-start; background:var(--glass-bg); border-radius:9px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--fg-3); flex:none; transition:background .16s var(--ease); }
.d-close:hover{ background:var(--bg-card-hover); }

.d-kpirow{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:0 20px; }
@media (max-width:480px){ .d-kpirow{ grid-template-columns:repeat(2,1fr); } }
.d-kpi{ background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:12px; padding:9px 11px; }
.d-kpi .kl{ font-family:var(--font-display); font-size:9px; font-weight:500; letter-spacing:.05em; text-transform:uppercase; color:var(--fg-3); margin-bottom:2px; }
.d-kpi .kv{ font-size:16px; font-weight:700; color:var(--accent); letter-spacing:-.02em; }

.d-body{ padding:16px 20px 26px; display:flex; flex-direction:column; gap:14px; }
.d-fieldrow{ display:flex; gap:18px; flex-wrap:wrap; }
.d-field{ min-width:90px; }
.d-field .fl{ font-size:9.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--fg-3); font-weight:600; margin-bottom:2px; }
.d-field .fv{ font-size:12.5px; font-weight:600; color:var(--fg-2); }

.d-links{ display:flex; flex-direction:column; gap:10px; padding:12px 12px 10px; border-radius:14px; background:var(--glass-bg); border:1px solid var(--glass-border); }
.d-links-head{ display:flex; align-items:center; gap:8px; }
.d-links-head .fl{ font-size:9.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--fg-3); font-weight:600; }
.d-links-n{ font-family:var(--font-display); font-size:13px; font-weight:600; line-height:1.4; padding:0 8px; border-radius:9999px; color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, transparent); }
.d-links-legend{ margin-left:auto; display:flex; align-items:center; gap:5px; font-size:9.5px; font-weight:600; color:var(--fg-3); }
.d-links-legend i{ width:7px; height:7px; border-radius:50%; background:var(--accent-rose); }
.d-links-strip{ display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; scroll-snap-type:x proximity; overscroll-behavior-x:contain; }
.d-link{ all:unset; box-sizing:border-box; cursor:pointer; flex:none; width:80px; display:flex; flex-direction:column; gap:4px; scroll-snap-align:start; position:relative; }
.d-link img{ width:80px; height:auto; aspect-ratio:63/88; object-fit:cover; border-radius:8px; display:block; background:var(--bg-card); box-shadow:0 6px 14px -8px rgba(0,0,0,.5); transition:transform .2s var(--ease-b); }
@media (hover:hover){ .d-link:hover img{ transform:translateY(-3px); } }
.d-link:focus-visible img{ outline:2px solid var(--accent-light); outline-offset:2px; }
.d-link-name{ font-size:10.5px; font-weight:600; color:var(--fg-1); line-height:1.2; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.d-link-by{ font-size:8.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--fg-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.d-link.is-name .d-link-by{ color:var(--accent); }
.d-link.is-need img{ opacity:.6; }
.d-link.is-need::after{ content:""; position:absolute; top:5px; right:5px; width:8px; height:8px; border-radius:50%; background:var(--accent-rose); box-shadow:0 0 0 2px rgba(0,0,0,.25); }
.d-links-empty{ font-size:11.5px; color:var(--fg-3); }

.d-effect{ background:var(--bg-mid); border-radius:12px; padding:14px 16px; }
.d-effect .fl{ font-size:9px; text-transform:uppercase; letter-spacing:.1em; color:rgba(139,205,255,.6); font-weight:700; margin-bottom:6px; }
.d-effect p{ margin:0; font-size:13.5px; line-height:1.6; color:rgba(207,224,240,.88); white-space:pre-line; }
.d-effect p.vanilla{ color:rgba(207,224,240,.45); font-style:normal; }

.d-tagrow{ display:flex; flex-wrap:wrap; gap:7px; }
.d-tagrow .tag{ font-size:10.5px; padding:5px 13px; }

.d-source{ font-size:11.5px; color:var(--fg-3); border-top:1px dashed var(--border); padding-top:10px; }
.d-source strong{ color:var(--fg-2); font-weight:600; }

.d-faq{ font-size:11.5px; color:var(--fg-3); line-height:1.5; background:var(--glass-bg); border:1px solid var(--glass-border); border-radius:12px; padding:10px 12px; }
.d-faq b{ display:block; color:var(--fg-1); font-weight:600; margin-bottom:2px; font-size:12px; }

/* ===== LANGUAGE TOGGLE ===== */
.lang-toggle{ all:unset; box-sizing:border-box; cursor:pointer; display:flex; margin-left:auto; background:rgba(255,255,255,.08); border-radius:9999px; padding:3px; gap:2px; flex:none; }
.lang-toggle .lt-opt{ font-family:var(--font-display); font-size:10px; font-weight:600; letter-spacing:.04em; padding:4px 9px; border-radius:9999px; color:var(--fg-footer-3); transition:background .16s var(--ease), color .16s var(--ease); }
.lang-toggle .lt-opt.active{ background:var(--accent-light); color:#0e2338; }

/* ===== SEARCHBAR (referencia: buscador oficial gundam-gcg.com) ===== */
.searchbar{
  display:flex; align-items:center; gap:12px; border-radius:9999px; padding:6px 8px 6px 20px; flex-wrap:wrap;
  background:var(--glass-bg-strong); border:1px solid var(--glass-border); box-shadow:var(--glass-shadow);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  transition:border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.sb-eyebrow{ font-family:var(--font-display); font-size:10.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-1); white-space:nowrap; }
.sb-div{ width:1px; height:20px; background:var(--border); flex:none; }
.sb-input{ flex:1; min-width:120px; border:none; outline:none; background:transparent; font-family:var(--font-sans); font-size:13px; color:var(--fg-1); padding:8px 2px; }
.sb-input::placeholder{ color:var(--fg-3); }
.searchbar:focus-within{ border-color:color-mix(in srgb, var(--accent-light) 70%, transparent); box-shadow:var(--glass-shadow), 0 0 0 4px color-mix(in srgb, var(--accent-light) 22%, transparent); }
.sb-btn{ all:unset; box-sizing:border-box; cursor:pointer; width:34px; height:34px; border-radius:9999px; background:var(--accent-light); display:flex; align-items:center; justify-content:center; color:#0e2338; flex:none; transition:transform .16s var(--ease); }
.sb-btn:hover{ transform:scale(1.05); }
.addfilter-btn{
  all:unset; box-sizing:border-box; display:flex; align-items:center; gap:6px; cursor:pointer;
  background:var(--accent); color:#fff; font-family:var(--font-sans); font-size:11.5px; font-weight:700;
  padding:8px 15px 8px 12px; border-radius:9999px; flex:none; transition:transform .16s var(--ease), opacity .16s var(--ease);
  white-space:nowrap;
}
.addfilter-btn:hover{ transform:translateY(-1px); opacity:.92; }

/* ===== DECK PILL ===== */
.deck-pill{
  all:unset; box-sizing:border-box; display:flex; align-items:center; gap:7px; cursor:pointer;
  background:var(--accent-light); color:#0e2338; font-family:var(--font-sans); font-size:12px; font-weight:700;
  padding:8px 14px; border-radius:9999px; flex:none; transition:transform .16s var(--ease);
}
.deck-pill:hover{ transform:translateY(-1px); }
.deck-pill svg{ flex:none; }

/* ===== DECK PILL DROPDOWN ===== */
.pillWrap{ position:relative; flex:none; }
.pillMenu{
  position:absolute; top:calc(100% + 8px); right:0; z-index:50; min-width:190px;
  background:var(--glass-bg-strong); border-radius:16px; padding:6px; box-shadow:var(--glass-shadow), 0 20px 44px -16px rgba(0,0,0,.4);
  backdrop-filter:var(--glass-blur); -webkit-backdrop-filter:var(--glass-blur);
  border:1px solid var(--glass-border); opacity:0; transform:translateY(-6px); pointer-events:none;
  transition:opacity .16s var(--ease), transform .16s var(--ease);
}
.pillMenu.open{ opacity:1; transform:none; pointer-events:auto; }
.pm-item{
  all:unset; box-sizing:border-box; display:flex; align-items:center; gap:9px; width:100%; cursor:pointer;
  padding:9px 10px; border-radius:9px; font-family:var(--font-sans); font-size:12.5px; font-weight:600; color:var(--fg-1);
  transition:background .14s var(--ease);
}
.pm-item:hover{ background:var(--glass-bg); }
.pm-item svg{ flex:none; color:var(--accent); }

/* ===== DECK STEPPER (mini, en cards) ===== */
.deck-stepper{
  display:flex; align-items:center; justify-content:center; gap:8px; padding:4px 0 6px;
  border-bottom:1px solid var(--border); margin-bottom:6px;
}
.deck-stepper.has-qty .ds-count{ color:var(--accent); font-weight:700; }
.ds-btn{
  all:unset; box-sizing:border-box; cursor:pointer; width:20px; height:20px; border-radius:9999px;
  display:flex; align-items:center; justify-content:center; background:var(--bg-card); color:var(--fg-2);
  font-size:13px; line-height:1; transition:background .15s var(--ease), color .15s var(--ease);
}
.ds-btn:hover{ background:var(--accent); color:#fff; }
.ds-count{ font-size:12px; font-weight:600; color:var(--fg-3); min-width:14px; text-align:center; }
.d-stepper .ds-btn{ width:26px; height:26px; font-size:16px; }
.d-stepper .ds-count{ font-size:14px; min-width:20px; }
.d-stepper{ display:flex; align-items:center; gap:10px; padding:10px 20px 0; }
.d-stepper-label{ font-size:11px; color:var(--fg-3); font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-right:auto; }

/* ===== DECK UI (compartido) ===== */
.deck-card-pips{ display:flex; gap:3px; }
.dd-iconbtn{
  all:unset; box-sizing:border-box; cursor:pointer; width:30px; height:30px; border-radius:8px; flex:none;
  display:flex; align-items:center; justify-content:center; background:var(--bg-card); color:var(--fg-2); font-size:15px;
  transition:background .15s var(--ease), color .15s var(--ease);
}
.dd-iconbtn:hover{ background:var(--accent); color:#fff; }
.dd-iconbtn.dd-danger.armed{ background:var(--accent-rose); color:#5c1f1f; font-weight:700; }
.dd-close{ all:unset; box-sizing:border-box; cursor:pointer; width:30px; height:30px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; color:var(--fg-3); }
.dd-close:hover{ background:var(--bg-card); }
.dd-stat{ background:var(--bg-card); border-radius:9px; padding:5px 9px; display:flex; flex-direction:column; min-width:44px; }
.dd-stat b{ font-size:14px; font-weight:700; color:var(--fg-1); font-variant-numeric:tabular-nums; }
.dd-stat span{ font-size:8.5px; color:var(--fg-3); text-transform:uppercase; letter-spacing:.04em; }
.dd-stat.warn b{ color:var(--accent-rose); }
.dd-pip{ width:7px; height:7px; border-radius:50%; flex:none; }
.dd-pip[data-color="Blue"]{ background:var(--c-blue); } .dd-pip[data-color="Green"]{ background:var(--c-green); }
.dd-pip[data-color="Red"]{ background:var(--c-red); } .dd-pip[data-color="Purple"]{ background:var(--c-purple); }
.dd-pip[data-color="White"]{ background:var(--c-white); }
.dd-needtag{ background:var(--need-bg,rgba(244,166,166,.35)); color:#8a3f3f; border-radius:5px; padding:0 5px; font-weight:600; }
.ds-btn:disabled{ opacity:.3; cursor:not-allowed; }
.ds-btn:disabled:hover{ background:var(--bg-card); color:var(--fg-2); }

/* ===== MIS MAZOS (página oscura, fuera del catálogo) ===== */
.decksPage{
  --bg-primary:#15122a; --bg-surface:#1d1a38; --bg-card:#2b2650; --bg-card-hover:#342e5e;
  --fg-1:#f0f4f8; --fg-2:#cfe0f0; --fg-3:#8896b8;
  --border:#39335f; --border-light:#2d2852;
  --shadow-in: inset 0 1px 0 rgba(255,255,255,.06), inset 0 -1px 0 rgba(0,0,0,.3);
  color-scheme:dark;
  position:fixed; left:0; right:0; bottom:0; top:64px; z-index:35; overflow-y:auto; color:var(--fg-2);
  background:
    radial-gradient(900px 520px at 88% -10%, color-mix(in srgb, var(--accent) 38%, transparent), transparent 62%),
    radial-gradient(700px 520px at -5% 105%, color-mix(in srgb, var(--accent-light) 12%, transparent), transparent 60%),
    #15122a;
  animation:dpIn .32s var(--ease-b);
}
@keyframes dpIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
.dp-inner{ max-width:1240px; margin:0 auto; padding:22px 24px 56px; display:flex; flex-direction:column; gap:18px; }
@media (max-width:560px){ .dp-inner{ padding:16px 16px 40px; } }
.dp-back{
  all:unset; box-sizing:border-box; align-self:flex-start; display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-3);
  padding:7px 13px 7px 10px; border-radius:9999px; background:rgba(255,255,255,.04); border:1px solid var(--border);
  transition:color .15s var(--ease), background .15s var(--ease);
}
.dp-back:hover{ color:var(--fg-1); background:rgba(255,255,255,.09); }
#dpList, #dpDetail{ display:flex; flex-direction:column; gap:22px; }
.dp-head{ display:flex; flex-direction:column; gap:4px; }
.dp-eyebrow{ font-family:var(--font-display); font-size:11.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-light); font-variant-numeric:tabular-nums; }
.dp-eyebrow .warn{ color:var(--accent-rose); }
.dp-title{ font-size:clamp(28px,4vw,45px); font-weight:500; line-height:1.1; letter-spacing:-.01em; color:var(--fg-1); text-wrap:balance; }

.dp-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:4px; }
.dp-deck, .dp-new{ min-height:168px; border-radius:16px; }
.dp-deck{
  position:relative; padding:16px 16px 14px; cursor:pointer; display:flex; flex-direction:column; gap:12px; outline:none;
  background:color-mix(in srgb, var(--accent) 16%, rgba(255,255,255,.02));
  border:1px solid color-mix(in srgb, var(--accent-light) 16%, transparent);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  transition:transform .22s var(--ease-b), background .2s var(--ease), border-color .2s var(--ease);
}
.dp-deck:hover, .dp-deck:focus-visible{ transform:translateY(-3px); background:color-mix(in srgb, var(--accent) 26%, rgba(255,255,255,.02)); border-color:color-mix(in srgb, var(--accent-light) 38%, transparent); }
.dp-deck.is-active{ border-color:color-mix(in srgb, var(--accent-light) 55%, transparent); }
.dp-deck-name{ font-size:11.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-1); padding-right:36px; overflow-wrap:anywhere; line-height:1.4; }
.dp-deck-chips{ display:flex; flex-wrap:wrap; gap:6px; }
.dp-chip{ display:inline-flex; align-items:center; gap:5px; font-size:9.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:9999px; background:rgba(255,255,255,.07); color:var(--fg-2); }
.dp-deck-count{ display:flex; align-items:baseline; gap:6px; margin-top:auto; }
.dp-deck-count b{ font-family:var(--font-display); font-size:46px; font-weight:600; line-height:.9; color:var(--fg-1); font-variant-numeric:tabular-nums; }
.dp-deck-count span{ font-size:11.5px; font-weight:600; color:var(--fg-3); }
.dp-bar{ height:4px; border-radius:3px; background:rgba(255,255,255,.08); overflow:hidden; }
.dp-bar i{ display:block; height:100%; background:var(--accent-light); border-radius:3px; }
.dp-del{ position:absolute; top:12px; right:12px; }
.dp-new{
  all:unset; box-sizing:border-box; border:1.5px dashed var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer;
  color:var(--fg-3); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  transition:border-color .15s var(--ease), color .15s var(--ease), background .15s var(--ease);
}
.dp-new:hover, .dp-new:focus-visible{ border-color:var(--accent-light); color:var(--accent-light); background:rgba(139,205,255,.04); }

.dp-dhead{ flex-direction:row; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; }
.dp-dtitle{ display:flex; flex-direction:column; gap:4px; flex:1; min-width:220px; }
.dp-name{
  all:unset; box-sizing:border-box; width:100%; font-family:var(--font-sans); font-size:clamp(26px,3.6vw,40px); font-weight:500;
  color:var(--fg-1); line-height:1.2; border-bottom:1px solid transparent; padding-bottom:2px; transition:border-color .15s var(--ease);
}
.dp-name:hover{ border-bottom-color:var(--border); }
.dp-name:focus{ border-bottom-color:var(--accent-light); }
.dp-actions{ display:flex; gap:8px; flex-wrap:wrap; }
.dp-btn{
  all:unset; box-sizing:border-box; display:inline-flex; align-items:center; gap:7px; cursor:pointer; font-size:12.5px; font-weight:700;
  padding:10px 16px; border-radius:9999px; background:rgba(255,255,255,.06); color:var(--fg-1); border:1px solid var(--border);
  transition:background .15s var(--ease), transform .15s var(--ease);
}
.dp-btn:hover{ background:rgba(255,255,255,.11); transform:translateY(-1px); }
.dp-btn-primary{ background:var(--accent-light); color:#0e2338; border-color:transparent; }
.dp-btn-primary:hover{ background:#a6d9ff; }

.dp-rows{ display:flex; flex-direction:column; gap:16px; }
.dp-row{ position:relative; overflow:hidden; border-radius:16px; padding:14px 14px 14px 18px; background:rgba(255,255,255,.03); border:1px solid var(--border); display:flex; flex-direction:column; gap:12px; }
.dp-row::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--row-c, var(--fg-3)); }
.dp-row-head{ display:flex; align-items:center; gap:10px; }
.dp-row-head .dd-pip{ width:10px; height:10px; }
.dp-row-title{ font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-1); }
.dp-row-count{ font-size:11.5px; font-weight:600; color:var(--fg-3); }
.dp-cols{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }
@media (max-width:1020px){ .dp-cols{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:560px){
  .dp-cols{ grid-template-columns:1fr; gap:8px; }
  .dp-col:has(.dp-col-empty){ padding:10px 12px; opacity:.6; }
  .dp-col:has(.dp-col-empty) .dp-col-head{ border:none; padding:0 4px; margin:0; }
  .dp-col:has(.dp-col-empty) .dp-col-empty{ display:none; }
}
.dp-col{
  min-width:0; border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:4px;
  background:color-mix(in srgb, var(--accent) 12%, rgba(255,255,255,.02));
  border:1px solid color-mix(in srgb, var(--accent-light) 12%, transparent);
}
.dp-col-head{ display:flex; justify-content:space-between; align-items:baseline; padding:2px 4px 8px; margin-bottom:2px; border-bottom:1px solid var(--border); }
.dp-col-head .eyebrow{ color:var(--fg-2); }
.dp-col-head b{ font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--fg-1); font-variant-numeric:tabular-nums; }
.dp-col-empty{ font-size:11px; color:var(--fg-3); padding:12px 4px; text-align:center; opacity:.6; }
.dp-card{ display:flex; align-items:center; gap:9px; padding:5px 4px; border-radius:9px; transition:background .15s var(--ease), opacity .2s var(--ease); }
.dp-card:hover{ background:rgba(255,255,255,.04); }
.dp-card.is-zero{ opacity:.4; }
.dp-card img{ width:38px; height:53px; object-fit:cover; border-radius:5px; flex:none; background:var(--bg-card); cursor:zoom-in; }
.dp-cinfo{ flex:1; min-width:0; }
.dp-cname{ font-size:12px; font-weight:600; color:var(--fg-1); line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.dp-cnum{ font-size:9.5px; color:var(--fg-3); margin-top:3px; display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
.dp-card .deck-stepper{ border:none; margin:0; padding:0; gap:6px; flex:none; }
.dp-card .ds-count{ font-size:13px; min-width:12px; }
.dp-card .deck-stepper.has-qty .ds-count{ color:var(--accent-light); }
.decksPage .dd-needtag{ background:rgba(244,166,166,.16); color:var(--accent-rose); }

/* ===== COMPARATIVA DE MAZOS ===== */
.cmpScrim{ position:fixed; inset:0; background:rgba(10,9,20,.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:55; opacity:0; transition:opacity .22s var(--ease); }
.cmpScrim.show{ opacity:1; }
.cmpModal{
  position:fixed; inset:24px; z-index:56; margin:auto; max-width:960px; max-height:88vh; width:calc(100% - 48px);
  background:var(--glass-bg-strong); border:1px solid var(--glass-border); border-radius:22px;
  backdrop-filter:saturate(170%) blur(28px); -webkit-backdrop-filter:saturate(170%) blur(28px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 30px 70px -20px rgba(0,0,0,.5);
  display:flex; flex-direction:column; opacity:0; transform:translateY(10px) scale(.98);
  transition:opacity .22s var(--ease-b), transform .22s var(--ease-b);
}
.cmpModal.open{ opacity:1; transform:none; }

  function buildFilters(){
    var setBox = document.getElementById('f-set'); setBox.innerHTML = '';
    function buildSetGroup(keys, label){
      if(!keys.length) return;
      setBox.appendChild(el('div','sb-subhead', label));
      var row = el('div','sb-chips');
      keys.forEach(function(s){
        var n = ALL.filter(function(x){return x.set===s;}).length;
        var b = chip(s+' · '+n, function(btn){ toggle(state.sets,s); btn.classList.toggle('active'); });
        b.classList.toggle('active', state.sets.has(s));
        row.appendChild(b);
      });
      setBox.appendChild(row);
    }
    buildSetGroup(SET_KEYS.filter(function(s){return s.indexOf('ST')===0;}), t().setStarterLbl);
    buildSetGroup(SET_KEYS.filter(function(s){return s.indexOf('GD')===0;}), t().setExpansionLbl);
    var colorBox = document.getElementById('f-color'); colorBox.innerHTML = '';
    COLOR_ORDER.forEach(function(c){
      if(!ALL.some(function(x){return x.color===c;})) return;
      var b = chip(t().colors[c]||c, function(btn){ toggle(state.colors,c); btn.classList.toggle('active'); }, {color:c});
      b.classList.toggle('active', state.colors.has(c));
      colorBox.appendChild(b);
    });
    var typeBox = document.getElementById('f-type'); typeBox.innerHTML = '';
    TYPE_ORDER.forEach(function(ty){
      var b = chip(t().types[ty]||ty, function(btn){ toggle(state.types,ty); btn.classList.toggle('active'); });
      b.classList.toggle('active', state.types.has(ty));
      typeBox.appendChild(b);
    });
    var counts = {};
    ALL.forEach(function(c){ c.tags.forEach(function(tg){ counts[tg]=(counts[tg]||0)+1; }); });
    var tagBox = document.getElementById('f-tag'); tagBox.innerHTML = '';
    Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];}).forEach(function(tg){
      var b = chip((t().tags[tg]||tg)+' · '+counts[tg], function(btn){ toggle(state.tags,tg); btn.classList.toggle('active'); });
      b.classList.toggle('active', state.tags.has(tg));
      tagBox.appendChild(b);
    });
    var traitCounts = {};
    ALL.forEach(function(c){ traitList(c).forEach(function(tr){ traitCounts[tr]=(traitCounts[tr]||0)+1; }); });
    var traitBox = document.getElementById('f-trait'); traitBox.innerHTML = '';
    Object.keys(traitCounts).sort(function(a,b){return traitCounts[b]-traitCounts[a];}).forEach(function(tr){
      var b = chip(tr+' · '+traitCounts[tr], function(btn){ toggle(state.traits,tr); btn.classList.toggle('active'); });
      b.classList.toggle('active', state.traits.has(tr));
      traitBox.appendChild(b);
    });
  }

  function toggle(set,val){ if(set.has(val)) set.delete(val); else set.add(val); }

  function matches(c){
    if(state.ownedOnly && !c.owned) return false;
    if(state.sets.size && !state.sets.has(c.set)) return false;
    if(state.colors.size && !state.colors.has(c.color)) return false;
    if(state.types.size && !state.types.has(c.type)) return false;
    if(state.tags.size){ var ok=false; state.tags.forEach(function(tg){ if(c.tags.indexOf(tg)!==-1) ok=true; }); if(!ok) return false; }
    if(state.traits.size){ var okT=false; var tl=traitList(c); state.traits.forEach(function(tr){ if(tl.indexOf(tr)!==-1) okT=true; }); if(!okT) return false; }
    if(state.search){
      var q = state.search.toLowerCase();
      var hay = (c.name+' '+c.number+' '+c.effect+' '+(c.effect_es||'')+' '+c.trait).toLowerCase();
      if(hay.indexOf(q)===-1) return false;
    }
    return true;
  }

  function tile(card){
    var dz = el('div','dz');
    var inner = el('div','dz-inner');
    inner.onclick = function(){ openDetail(card); };
    var bit = el('div','colorbit'); bit.dataset.color = card.color; inner.appendChild(bit);
    var status = el('div','delta '+(card.owned?'delta-up':'delta-dn')+' status', card.owned?t().tengo:t().falta);
    inner.appendChild(status);
    var imgwrap = el('div','card-imgwrap');
    var img = document.createElement('img'); img.loading='lazy'; img.src='images/'+card.number+'.webp'; img.alt=card.name;
    imgwrap.appendChild(img); inner.appendChild(imgwrap);
    var body = el('div','card-body');
    body.appendChild(stepperEl(card.number));
    var tags = el('div','card-tagrow');
    card.tags.slice(0,2).forEach(function(tg){ tags.appendChild(el('span','tag', t().tags[tg]||tg)); });
    body.appendChild(tags);
    inner.appendChild(body);
    dz.appendChild(inner);
    return {dz:dz, inner:inner};
  }

  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  }, {threshold:.05}) : null;

  function render(){
    var filtered = ALL.filter(matches);
    var grid = document.getElementById('grid');
    grid.innerHTML = '';
    if(!filtered.length){
      grid.appendChild(el('div','empty', t().noResults));
    } else {
      var frag = document.createDocumentFragment();
      filtered.forEach(function(c,i){
        var tl = tile(c);
        frag.appendChild(tl.dz);
        if(io){
          tl.inner.style.transitionDelay = (Math.min(i % 18, 18) * 14) + 'ms';
          io.observe(tl.inner);
        } else { tl.inner.classList.add('in'); }
      });
      grid.appendChild(frag);
    }
    document.getElementById('resultcount').textContent = t().resultCount(filtered.length, ALL.length);
    document.getElementById('sbApply').textContent = t().showResults(filtered.length);
    renderActiveFilters();
  }

  function renderActiveFilters(){
    var wrap = document.getElementById('activeFilters');

    function addRemovable(label, onRemove){
      var tg = el('span','tag removable');
      tg.appendChild(document.createTextNode(label));
      var btn = document.createElement('button'); btn.textContent = '✕';
      btn.onclick = onRemove; tg.appendChild(btn); wrap.appendChild(tg);
    }
    state.sets.forEach(function(s){ addRemovable(s, function(){ state.sets.delete(s); buildFilters(); render(); }); });
    state.colors.forEach(function(c){ addRemovable(t().colors[c]||c, function(){ state.colors.delete(c); buildFilters(); render(); }); });
    state.types.forEach(function(ty){ addRemovable(t().types[ty]||ty, function(){ state.types.delete(ty); buildFilters(); render(); }); });
    state.tags.forEach(function(tg){ addRemovable(t().tags[tg]||tg, function(){ state.tags.delete(tg); buildFilters(); render(); }); });
    state.traits.forEach(function(tr){ addRemovable(tr, function(){ state.traits.delete(tr); buildFilters(); render(); }); });
    if(state.ownedOnly){ addRemovable(t().onlyMine, function(){ state.ownedOnly=false; document.getElementById('ownedOnly').checked=false; render(); }); }
    var nActive = state.sets.size + state.colors.size + state.types.size + state.tags.size + state.traits.size + (state.ownedOnly?1:0);

    badge.hidden = !nActive; badge.textContent = nActive;
  }

  var sidebar = document.getElementById('sidebar'), scrim = document.getElementById('scrim');
  function openSidebar(){ sidebar.classList.add('open'); scrim.classList.add('show'); sidebar.scrollTop = 0; updateTabbar(); }
  function closeSidebar(){ sidebar.classList.remove('open'); scrim.classList.remove('show'); updateTabbar(); }
  document.getElementById('addFilterBtn').addEventListener('click', function(){
    if(window.matchMedia('(max-width:860px)').matches){ openSidebar(); return; }
    document.querySelectorAll('.sb-tagwrap').forEach(function(w){ w.classList.add('open'); });
    sidebar.scrollTo({top:0, behavior:'smooth'});
  });
  scrim.addEventListener('click', closeSidebar);
  document.getElementById('sbClose').addEventListener('click', closeSidebar);
  document.getElementById('sbApply').addEventListener('click', function(){
    closeSidebar();
    document.querySelector('.db-main').scrollTo({top:0, behavior:'smooth'});
  });

  function updateTabbar(){
    var active = !document.getElementById('decksPage').hidden ? 'tbDecks' : sidebar.classList.contains('open') ? 'tbFilters' : 'tbCatalog';
    ['tbCatalog','tbFilters','tbDecks'].forEach(function(id){
      var b = document.getElementById(id);
      b.classList.toggle('is-active', id===active);
      if(id===active) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
    });
  }
  document.getElementById('tbCatalog').addEventListener('click', function(){
    var wasHome = document.getElementById('decksPage').hidden && !sidebar.classList.contains('open');
    closeSidebar();
    if(!document.getElementById('decksPage').hidden) closeDecksPage();
    if(wasHome) document.querySelector('.db-main').scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('tbFilters').addEventListener('click', function(){
    if(sidebar.classList.contains('open')){ closeSidebar(); return; }
    if(!document.getElementById('decksPage').hidden) closeDecksPage();
    openSidebar();
  });
  document.getElementById('tbNew').addEventListener('click', function(){
    closeSidebar();
    if(!document.getElementById('decksPage').hidden) closeDecksPage();
    document.querySelector('.db-main').scrollTo({top:0, behavior:'smooth'});
    openAddDeckPanel();
  });
  document.getElementById('tbDecks').addEventListener('click', function(){ closeSidebar(); openDecksPage(); });

  /* Acordeón Añadir mazo / Ver mis mazos: solo uno seleccionado */
  var btnAdd = document.getElementById('btnAddDeck'), btnMy = document.getElementById('btnMyDecks');
  var addPanel = document.getElementById('addDeckPanel'), newDeckInput = document.getElementById('newDeckName');
  function selectDeckAction(which){
    var addOpen = which==='add';
    btnAdd.classList.toggle('is-selected', addOpen);
    btnAdd.setAttribute('aria-expanded', String(addOpen));
    btnMy.classList.toggle('is-selected', which==='my');
    btnMy.setAttribute('aria-pressed', String(which==='my'));
    addPanel.classList.toggle('open', addOpen);
    addPanel.inert = !addOpen;
  }
  function openAddDeckPanel(){
    selectDeckAction('add');
    newDeckInput.value = '';
    newDeckInput.focus({preventScroll:true});
  }
  btnAdd.addEventListener('click', function(){
    if(btnAdd.classList.contains('is-selected')) selectDeckAction(null); else openAddDeckPanel();
  });
  btnMy.addEventListener('click', openDecksPage);
  document.getElementById('addDeckForm').addEventListener('submit', function(e){
    e.preventDefault();
    var name = newDeckInput.value.trim() || (t().deckNewName+' '+(Object.keys(DECKS).length+1));
    activeDeckId = createDeck(name);
    newDeckInput.value = ''; newDeckInput.blur();
    selectDeckAction(null);
    setBuilding(true);
    saveDecksToStorage(); render(); updateDeckPill();
    var bar = document.getElementById('buildBar');
    bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = '';
  });
  document.getElementById('bbView').addEventListener('click', function(){
    openDecksPage(); openDeckDetail(activeDeckId);
  });
  document.getElementById('bbClose').addEventListener('click', function(){ setBuilding(false); });

  /* Página Mis mazos */
  var decksPage = document.getElementById('decksPage');
  document.getElementById('dpBack').addEventListener('click', function(){
    if(dpDeckId){ dpDeckId = null; showDpView(); decksPage.scrollTop = 0; } else closeDecksPage();
  });
  document.getElementById('dpName').addEventListener('input', function(e){
    if(!DECKS[dpDeckId]) return;
    DECKS[dpDeckId].name = e.target.value; saveDecksToStorage();
  });
  document.getElementById('dpAddCards').addEventListener('click', goAddCards);
  document.getElementById('dpCopy').addEventListener('click', function(){
    if(!DECKS[dpDeckId]) return;
    var text = deckAsText(DECKS[dpDeckId]);
    var label = document.getElementById('lblDpCopy');
    function done(){ label.textContent = t().deckCopied; setTimeout(function(){ label.textContent = t().deckCopy; }, 1400); }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(function(){ fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  });

  /* Menú del pill */
  var pillMenu = document.getElementById('pillMenu');
  function openPillMenu(){ pillMenu.hidden = false; requestAnimationFrame(function(){ pillMenu.classList.add('open'); }); }
  function closePillMenu(){ pillMenu.classList.remove('open'); setTimeout(function(){ pillMenu.hidden = true; }, 160); }
  document.getElementById('deckPill').addEventListener('click', function(e){
    e.stopPropagation();
    if(pillMenu.hidden) openPillMenu(); else closePillMenu();
  });
  document.addEventListener('click', function(e){
    if(!pillMenu.hidden && !e.target.closest('.pillWrap')) closePillMenu();
  });
  document.getElementById('pmNewDeck').addEventListener('click', function(){
    closePillMenu();
    if(!decksPage.hidden){
      var id = createDeck(t().deckNewName+' '+(Object.keys(DECKS).length+1));
      openDeckDetail(id);
      var ni = document.getElementById('dpName'); ni.focus(); ni.select();
    } else {
      document.querySelector('.db-main').scrollTo({top:0, behavior:'smooth'});
      openAddDeckPanel();
    }
  });
  document.getElementById('pmMyDecks').addEventListener('click', function(){ closePillMenu(); openDecksPage(); });
  document.getElementById('pmCompare').addEventListener('click', function(){ closePillMenu(); openCompareModal(); });

  var cmpScrim = document.getElementById('cmpScrim'), cmpModal = document.getElementById('cmpModal');
  function openCompareModal(){
    renderCompare();
    cmpScrim.hidden = false; cmpModal.hidden = false;
    requestAnimationFrame(function(){ cmpScrim.classList.add('show'); cmpModal.classList.add('open'); });
  }
  function closeCompareModal(){
    cmpScrim.classList.remove('show'); cmpModal.classList.remove('open');
    setTimeout(function(){ cmpScrim.hidden = true; cmpModal.hidden = true; }, 220);
  }
  document.getElementById('cmpCloseBtn').addEventListener('click', closeCompareModal);
  cmpScrim.addEventListener('click', closeCompareModal);

  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape') return;
    if(pillMenu.classList.contains('open')){ closePillMenu(); return; }
    if(!cmpModal.hidden){ closeCompareModal(); return; }
    if(!document.getElementById('overlay').hidden){ closeDetail(); return; }
    if(sidebar.classList.contains('open')){ closeSidebar(); return; }
    if(!decksPage.hidden) document.getElementById('dpBack').click();
  });

  try{
    ALL = CARDS_DATA;
    loadDecksFromStorage();
    applyStaticI18n();
    buildFilters();
    render();
    updateDeckPill();
  }catch(err){
    document.getElementById('grid').innerHTML = '<div class="empty">'+(LANG==='es'?'No se pudieron cargar los datos: ':'Could not load data: ')+err+'</div>';
  }
})();
</script>
